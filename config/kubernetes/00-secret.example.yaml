# The Cruise key the gateway authenticates to Cruise with.
#
# Do not commit a filled-in copy of this file. Prefer creating the Secret from
# your environment so the key never lands on disk:
#
#   kubectl create namespace cruise
#   kubectl create secret generic cruise-api-key -n cruise \
#     --from-literal=Authorization="Bearer $CRUISE_API_KEY"
#
# The key in the Secret must be `Authorization`, and its value is the complete
# header value — the `Bearer ` prefix included. agentgateway sends it verbatim.
#
# The value below is deliberately EMPTY. `kubectl apply -f config/kubernetes/`
# sweeps this file up with the rest, and a placeholder that looks like a key
# would authenticate to Cruise and fail with a 401 that points nowhere. An empty
# value fails as `401 Missing bearer token.`, which names the problem.
apiVersion: v1
kind: Secret
metadata:
  name: cruise-api-key
  namespace: cruise
type: Opaque
stringData:
  Authorization: ""   # "Bearer cru_..." — or use the kubectl command above
