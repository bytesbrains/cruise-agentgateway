# A Gateway and a route that sends OpenAI-shaped traffic to the Cruise backend.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cruise
  namespace: cruise
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cruise
  namespace: cruise
spec:
  parentRefs:
    - name: cruise
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: cruise
