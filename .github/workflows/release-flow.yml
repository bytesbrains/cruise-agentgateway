# The branch flow, enforced: features and fixes merge into dev, and main takes only
# release PRs from dev. Branch protection cannot restrict a PR's source branch, so
# "release gate" is a required check on main. When a release PR merges, its version
# is tagged at the merge commit and published as a GitHub release.
#
# A release PR is dev -> main, titled "Release vX.Y.Z", with a version not yet tagged.
# The repository settings this relies on are listed in CONTRIBUTING.md.
#
# The gate runs on pull_request_target, which loads this file from the default branch,
# dev, not from the PR. So a PR cannot edit the check that judges it (#13). Changing the
# gate takes a merged PR into dev, and applies to PRs into main from that merge on.
# That is safe only because the gate reads event metadata and checks out nothing: never
# add a checkout of the PR here.
#
# Tagging stays on pull_request `closed`. The tag job acts only on a merged release PR
# from this repository's dev branch.
name: release flow

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  gate:
    name: release gate
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Only a versioned release PR from dev may target main
        # Untrusted PR fields go through env, never into the script text.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" || "$HEAD_REF" != dev ]]; then
            echo "::error::main takes only release PRs from dev. Open this PR against dev instead."
            exit 1
          fi
          if [[ ! "$TITLE" =~ ^Release\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Title a release PR 'Release vX.Y.Z'. That version becomes its tag."
            exit 1
          fi
          tag="${BASH_REMATCH[1]}"
          taken="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\")) | length")"
          if [[ "$taken" != 0 ]]; then
            echo "::error::$tag is already tagged. Choose the next version."
            exit 1
          fi
          echo "Release $tag from dev"

  tag:
    name: tag release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the merge commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^Release\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Merged release PR has no 'Release vX.Y.Z' title; tag it by hand."
            exit 1
          fi
          tag="${BASH_REMATCH[1]}"
          # Checked again here because the gate ran before merge and the tag could have
          # appeared since. `gh release create` does not fail on an existing tag: it
          # ignores --target and publishes the release on that tag's old commit.
          taken="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\")) | length")"
          if [[ "$taken" != 0 ]]; then
            echo "::error::$tag was tagged after the gate passed. $MERGE_SHA is untagged; tag it by hand with the next version."
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" \
            --title "$tag" --generate-notes
